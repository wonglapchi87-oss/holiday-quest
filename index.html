*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-size:20px;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;touch-action:manipulation;min-height:100vh;
  background:radial-gradient(circle at 8% -5%,#fff1cc 0,rgba(255,241,204,0) 38%),radial-gradient(circle at 105% 105%,#dff0ff 0,rgba(223,240,255,0) 45%),var(--bg);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
input,textarea,select{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
h1,h2,h3,p{margin:0}
#app{max-width:1400px;margin:0 auto;padding:22px 26px 48px}
.btn{min-height:64px;min-width:64px;padding:0 24px;border-radius:20px;font-weight:800;font-size:22px;background:var(--cl);color:var(--cd);
  display:inline-flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 0 rgba(0,0,0,.10);transition:transform .08s,box-shadow .08s;line-height:1.1;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.10)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.primary{background:var(--c);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.okl{background:var(--okl);color:var(--okd)}
.btn.warn{background:var(--pendl);color:var(--pendd)}
.btn.danger{background:var(--dangerl);color:var(--danger)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.08),inset 0 0 0 2px var(--line)}
.btn.round{width:72px;height:72px;padding:0;border-radius:50%;font-size:34px;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.08),inset 0 0 0 2px var(--line)}
.btn.small{min-height:56px;font-size:19px;padding:0 16px;border-radius:16px}
.btn.wide{width:100%}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
.card h2{font-size:26px;font-weight:900}
.sub{color:var(--muted);font-size:18px;margin-top:4px}
.date{color:var(--muted);font-size:20px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-weight:800;font-size:17px;background:#f3f0ea;color:var(--muted)}
.chip.ok{background:var(--okl);color:var(--okd)}
.chip.flag{background:#ffe3e3;color:#c0262c}
.chip.soon{background:var(--pendl);color:var(--pendd)}
.banner{margin:0 0 18px;padding:16px 22px;border-radius:22px;background:#fff6d8;border:3px dashed #f5cf5b;font-size:24px;font-weight:800;text-align:center}
.empty{grid-column:1/-1;text-align:center;font-size:30px;font-weight:800;padding:40px;background:#fff;border-radius:var(--r);box-shadow:var(--shadow)}
/* ---------- HOME ---------- */
.home-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.home-head h1{font-size:48px;font-weight:900;letter-spacing:-.5px}
.home-q{text-align:center;font-size:34px;font-weight:900;margin:34px 0 22px}
.profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px;max-width:1000px;margin:0 auto}
.profile{background:#fff;border-radius:36px;box-shadow:var(--shadow),inset 0 0 0 5px var(--cl);padding:30px 26px 26px;display:flex;flex-direction:column;align-items:center;gap:12px;transition:transform .1s}
.profile:active{transform:scale(.97)}
.avatar{width:170px;height:170px;border-radius:50%;background:var(--cl);display:flex;align-items:center;justify-content:center;font-size:110px;line-height:1}
.pname{font-size:46px;font-weight:900;color:var(--cd)}
.pbar{width:100%;height:22px;border-radius:999px;background:#f1eee8;overflow:hidden;display:block}
.pbar>span{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--ok));border-radius:999px}
.pstat{font-size:24px;font-weight:800}
.streak{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border-radius:999px;background:#fff0e0;color:#b85a00;font-weight:900;font-size:20px}
.streak.big{font-size:26px;padding:10px 18px;min-height:56px}
.home-foot{text-align:center;margin-top:30px;color:var(--muted);font-size:18px}

/* ---------- KID ---------- */
.khead{display:flex;align-items:center;gap:18px;margin-bottom:18px}
.kwho{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
.kav{width:84px;height:84px;border-radius:50%;background:var(--cl);display:flex;align-items:center;justify-content:center;font-size:54px;flex:none}
.kwho h1{font-size:40px;font-weight:900;color:var(--cd)}
.kright{display:flex;align-items:center;gap:12px}
.kgrid{display:grid;gap:22px;grid-template-columns:minmax(0,1fr) 370px;grid-template-areas:"tasks wallet";grid-template-rows:auto;align-items:start}
.tasks-col{grid-area:tasks}
.wallet{grid-area:wallet}
.extras{grid-area:auto}
.sec{font-size:26px;font-weight:900;margin:4px 4px 12px;display:flex;align-items:center;gap:10px}
.tasks+.sec{margin-top:22px}
.tasks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.task{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"e b" "a a";gap:12px 14px;align-items:center;border:4px solid transparent;transition:border-color .2s,background .2s}
.task.s-pending{border-color:#f7d48f;background:#fffaf0}
.task.s-done{border-color:#bfe9d3;background:#f5fcf8}
.task.flagged{border-color:#ffb3b3}
.temoji{grid-area:e;width:76px;height:76px;border-radius:22px;background:var(--cl);font-size:46px;display:flex;align-items:center;justify-content:center;line-height:1}
.tbody{grid-area:b;min-width:0}
.tname{font-size:26px;font-weight:900;line-height:1.15;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tnote{color:var(--muted);font-size:18px;margin-top:3px;line-height:1.25}
.tbody .chip{margin-top:8px}
.say{width:64px;height:64px;border-radius:50%;background:var(--cl);font-size:26px;display:inline-flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
.tact{grid-area:a;display:flex;gap:10px}
.tact .btn{flex:1}
.btn.did{background:var(--c);color:#fff;font-size:24px}
.btn.pendingb{background:var(--pendl);color:var(--pendd);font-size:20px}
.btn.timer{flex:0 0 auto;background:#fff;color:var(--cd);box-shadow:0 3px 0 rgba(0,0,0,.08),inset 0 0 0 2px var(--cl);font-size:20px;padding:0 16px}
.donebadge{flex:1;min-height:64px;border-radius:20px;background:var(--okl);color:var(--okd);font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;padding:0 10px}
.task.s-done .temoji{background:var(--okl)}
.bigmode .tasks{grid-template-columns:repeat(3,minmax(0,1fr))}
.bigmode .task{grid-template-columns:1fr;grid-template-areas:"e" "b" "a";justify-items:center;text-align:center;padding:22px 16px}
.bigmode .temoji{width:130px;height:130px;font-size:86px;border-radius:34px}
.bigmode .tname{font-size:32px;justify-content:center}
.bigmode .tact{width:100%;flex-direction:column}
.bigmode .btn.did{font-size:28px;min-height:76px}
.bigmode .donebadge{min-height:76px}
.wallet{text-align:center;position:relative;overflow:hidden;background:linear-gradient(180deg,#fffbea,#fff)}
.coin{font-size:78px;line-height:1;margin:2px auto 4px;display:inline-block;animation:wiggle 1s ease 1}
.balance{font-size:24px;font-weight:800}
.balance b{font-size:64px;font-weight:900;color:#b7791f;line-height:1}
.starry .balance b{color:#d69e2e}
.todaytok{font-size:21px;font-weight:800;color:var(--okd);margin-top:4px}
.gmini{display:flex;align-items:center;gap:12px;text-align:left;margin-top:14px;padding:12px 14px;border-radius:18px;background:#faf8f4;font-size:19px}
.gmini .gme{font-size:44px;flex:none}
.gbar{height:16px;margin-top:6px}
.gbar.big{height:30px;box-shadow:inset 0 2px 4px rgba(0,0,0,.06)}
.gbar>span{background:linear-gradient(90deg,#ffd23f,#f59a3c)}
.tokrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.tokchip{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:999px;background:#fff4cc;color:#8a5a00;font-weight:900;font-size:19px;white-space:nowrap}
.tokchip.got{background:var(--okl);color:var(--okd)}
.tokgot{font-weight:800;font-size:16px;color:var(--okd)}
.bigmode .tokrow{justify-content:center}
.bigmode .tokchip{font-size:30px;padding:6px 16px}
.bar{height:30px;border-radius:999px;background:#eeebe4;overflow:hidden;display:flex;margin:14px 0 8px;box-shadow:inset 0 2px 4px rgba(0,0,0,.06)}
.bar .bdone{background:linear-gradient(90deg,#52d493,var(--ok));transition:width .5s}
.bar .bpend{background:repeating-linear-gradient(45deg,#f9cf7c 0 10px,#f6bb4f 10px 20px);transition:width .5s}
.bartext{font-size:20px;font-weight:800}
.hint{font-size:20px;margin-top:10px;color:var(--muted)}
.mins{font-size:22px;margin:12px 0}
.mins b{font-size:46px;font-weight:900;color:var(--okd);display:block;line-height:1.05}
.wallet .btn{width:100%;margin-top:10px}
.btn.go{background:var(--ok);color:#fff;font-size:26px;min-height:76px}
.btn.check{background:var(--pendl);color:var(--pendd)}
.xlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.xchip{position:relative;min-height:100px;border-radius:18px;background:#faf8f4;box-shadow:inset 0 0 0 2px var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 8px;text-align:center;font-weight:800;font-size:18px;line-height:1.1}
.xchip:active{transform:scale(.97)}
.xe{font-size:32px;flex:none}
.xn{min-width:0}
.xs{position:absolute;top:6px;right:6px;font-size:15px;font-weight:900;color:var(--cd);background:var(--cl);border-radius:999px;padding:4px 8px}
.xchip.s-pending{background:var(--pendl);box-shadow:inset 0 0 0 2px #f7d48f}
.xchip.s-done{background:var(--okl);box-shadow:inset 0 0 0 2px #bfe9d3}
.xchip.s-done .xs,.xchip.s-pending .xs{background:none;font-size:22px;padding:0;top:4px;right:6px}
.xslots{grid-column:1 / -1;border-radius:18px;background:#faf8f4;box-shadow:inset 0 0 0 2px var(--line);padding:10px 12px 12px}
.xshead{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;line-height:1.15}
.xshead .xe{font-size:30px}.xshead .xn{flex:1;min-width:0}
.xcount{flex:none;font-size:15px;font-weight:900;color:var(--cd);background:var(--cl);border-radius:999px;padding:4px 10px;white-space:nowrap}
.xsrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.xchip.xslot{min-height:92px;background:#fff;padding:8px 4px}
.xchip.xslot .xs,.xchip.xslot.s-done .xs,.xchip.xslot.s-pending .xs{position:static}
.xchip.xslot.s-pending{background:var(--pendl)}.xchip.xslot.s-done{background:var(--okl)}
.tmin{display:none}.bigmode .tmin{display:inline}
.bonusmeter{margin-top:10px;font-size:20px;font-weight:800}
.bonusmeter .pbar{height:14px;margin-top:6px}
/* ---------- MODALS ---------- */
.modal-back{position:fixed;inset:0;background:rgba(30,32,50,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;animation:fade .15s ease}
.modal{background:#fff;border-radius:34px;padding:28px;max-width:640px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .22s ease;text-align:center}
.modal h2{font-size:32px;font-weight:900;margin-bottom:8px}
.modal p{font-size:21px;color:var(--muted)}
.modal .row{display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.modal .row .btn{flex:1;min-width:180px}
.modal.wide{max-width:980px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.pin .dots{display:flex;justify-content:center;gap:18px;margin:18px 0 20px}
.pin .dots i{width:26px;height:26px;border-radius:50%;background:#ebe7df;display:block;transition:background .1s}
.pin .dots i.on{background:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(3,96px);gap:14px;justify-content:center}
.key{height:84px;border-radius:24px;background:#f5f2ec;font-size:36px;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.key:active{transform:translateY(3px);box-shadow:none}
.pinerr{min-height:28px;color:var(--danger);font-weight:800;font-size:19px;margin-top:10px}
.bigtimer .ring{position:relative;width:320px;height:320px;margin:10px auto 18px}
.bigtimer svg{transform:rotate(-90deg)}
.bigtimer .tt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:72px;font-weight:900;font-variant-numeric:tabular-nums}
.bigtimer .tt small{font-size:20px;color:var(--muted);font-weight:800}
.bigtimer .temo{font-size:64px}
.celebrate .boom{font-size:110px;line-height:1;animation:wiggle 1.2s ease 1}
.clist{text-align:left;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.citem{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:#faf8f4}
.citem .ce{font-size:36px;width:48px;text-align:center}
.citem .cn{flex:1;font-weight:800;font-size:21px;line-height:1.15}
.citem .cn small{display:block;color:var(--muted);font-weight:700;font-size:16px}
.citem .btn{min-width:64px;padding:0 14px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-top:16px}
.wday{background:#faf8f4;border-radius:20px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:190px}
.wday.today{box-shadow:inset 0 0 0 3px var(--c)}
.wday.star{background:#fff8dc}
.wday b{font-size:20px}
.wday .wd{font-size:15px;color:var(--muted);font-weight:700}
.wday .wi{font-size:46px;line-height:1.2}
.wday .wn{font-size:15px;font-weight:800;color:var(--muted);line-height:1.3;text-align:center}
.wtot{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;margin-top:18px;font-size:21px;font-weight:800}
.wnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.wnav h3{font-size:22px}
.legend{margin-top:14px;font-size:16px;color:var(--muted)}

/* ---------- PARENT ---------- */
.phead{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.phead h1{font-size:38px;font-weight:900;flex:1}
.tabs{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.tab{min-height:64px;padding:0 22px;border-radius:20px;background:#fff;font-weight:800;font-size:21px;box-shadow:0 3px 0 rgba(0,0,0,.06),inset 0 0 0 2px var(--line)}
.tab.on{background:var(--ink);color:#fff;box-shadow:none}
.pgrid{display:grid;gap:18px}
.pgrid.two{grid-template-columns:1fr 1fr;align-items:start}
.daychips{display:flex;gap:10px;margin-top:14px;overflow-x:auto;padding-bottom:4px}
.daychip{min-width:92px;min-height:96px;border-radius:20px;background:#faf8f4;box-shadow:inset 0 0 0 2px var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:17px;flex:none}
.daychip span{font-size:30px}
.daychip.on{background:#fff6d8;box-shadow:inset 0 0 0 3px #f5cf5b}
.daychip.today{outline:3px solid var(--ink);outline-offset:-3px}
.kcheck h2{display:flex;align-items:center;gap:10px}
.kcheck .kmeta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
details{margin-top:14px}
summary{min-height:56px;display:flex;align-items:center;font-weight:800;font-size:20px;cursor:pointer;list-style:none;padding:0 14px;border-radius:16px;background:#f5f2ec}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";margin-right:10px}
details[open] summary::before{content:"▾"}
.adjrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-weight:800}
.seg{display:flex;gap:10px;margin-bottom:0}
.seg button{min-height:64px;padding:0 24px;border-radius:20px;background:#fff;font-weight:800;font-size:22px;box-shadow:inset 0 0 0 2px var(--line)}
.seg button.on{background:var(--ink);color:#fff;box-shadow:none}
.erow{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:2px solid #f3efe7}
.erow input:not([type]),.form input:not([type=checkbox]),.form select,.ed-opts select,.ed-opts input[type=number]{min-height:56px;border-radius:14px;border:2px solid var(--line);padding:0 14px;font-size:20px;background:#fff;width:100%}
.emoji-in{width:72px!important;flex:none;text-align:center;font-size:32px!important;padding:0!important;min-height:64px!important;border-radius:16px;border:2px solid var(--line)}
.ed-main{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.ed-opts{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:18px;font-weight:700}
.ed-opts input[type=number]{width:90px}
.ed-opts select{width:auto}
.ed-btns{display:flex;flex-direction:column;gap:6px}
.ed-btns .btn{min-height:56px;min-width:56px;padding:0;font-size:22px}
.tog{display:flex;align-items:center;gap:10px;min-height:56px;font-weight:700;font-size:19px}
.tog input{width:30px;height:30px;accent-color:var(--ok);flex:none}
.form{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:end}
.form label{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:17px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:2px solid #f3efe7}
.stepper .lbl{flex:1;font-weight:800;font-size:21px}
.stepper .lbl small{display:block;color:var(--muted);font-weight:600;font-size:17px}
.stepper .val{min-width:110px;text-align:center;font-size:30px;font-weight:900}
.stepper .btn{font-size:30px;padding:0}
textarea{width:100%;min-height:120px;border-radius:16px;border:2px solid var(--line);padding:12px;font-size:15px;font-family:ui-monospace,Menlo,monospace;margin-top:12px}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;font-size:200px;cursor:pointer}
.small-print{font-size:16px;color:var(--muted);margin-top:8px;line-height:1.35}
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(200%);background:var(--ink);color:#fff;padding:16px 26px;border-radius:20px;font-weight:800;font-size:21px;z-index:90;transition:transform .25s;max-width:90vw;text-align:center;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast:empty{display:none}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80;width:100vw;height:100vh}


/* ---------- v2: books, NAPLAN writing ---------- */
.tbook{font-size:18px;font-weight:800;color:var(--cd);margin-top:6px;line-height:1.3;overflow-wrap:anywhere}
.task.challenge{border:4px dashed #f5cf5b;background:#fffdf5}
.task.challenge.s-pending{border-style:solid;border-color:#f7d48f;background:#fffaf0}
.task.challenge.s-done{border-style:solid;border-color:#bfe9d3;background:#f5fcf8}
.task.challenge .temoji{background:#fff3c4}
.blist{display:flex;flex-direction:column;gap:8px;grid-area:l}
.task.haslist{grid-template-areas:"e b" "l l" "a a"}
.brow{min-height:56px;width:100%;display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);font-weight:800;font-size:19px;text-align:left}
.brow.s-pending{background:var(--pendl);box-shadow:inset 0 0 0 2px #f7d48f}
.brow.s-done{background:var(--okl);box-shadow:inset 0 0 0 2px #bfe9d3}
.brow .bt{flex:1;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.2;overflow-wrap:anywhere}
.brow .bs{font-size:15px;color:var(--muted);flex:none}
.bsplit{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:17px;color:var(--muted)}
.wview .card{margin-bottom:18px}
.wview .card h2{font-size:26px}

<script>
'use strict';
/* =========================================================
   Holiday Quest v3 — school-holiday jobs, tokens & wishes
   Jobs earn tokens once a grown-up confirms them. Tokens are saved up for
   wishes (goals) that Mum/Dad approve. All data stays on this device
   (localStorage). The only network use is the optional Google Drive upload
   of confirmed reading & writing (v3.1, see partD) to the family's own Apps Script link.
   ========================================================= */
const APP_VERSION = '3.5.0';
const APP_TAG = '3.5.0-clean-table-slots';
const DATA_VERSION = 6; // v3: tokens + wishes/goals replace the old screen-time reward; v6 (app 3.5.0): Clean the table bonus with meal slots
const READING_NOTE_V2 = 'Read for 20 minutes, then answer questions about your book';
const MAX_BOOKS_PER_DAY = 6;
const NAP_MIN_WORDS = 80, NAP_MAX_WORDS = 150, NAP_SUBMIT_MIN = 20;
const NAP_CONJUNCTIONS = ['Although','Though','Because','Since','While','When','Before','After','Until','As soon as','Unless','Provided that'];
const HENRY_WORDS = ['haunted','lighthouse','medal','curious','kicking','learns','situations','floted','stuks','trafic','unlokes','charcter','tresure'];
const NAP_PRESENT_VERBS = ['is','are','has','have','go','goes','runs','run','looks','look','says','say','loses','belongs','cannot','does',"doesn't"];
const STORE_KEY = 'holidayQuest.v1';
const PARENT_IDLE_MS = 5 * 60 * 1000;
const PIN_MAX_FAILS = 5, PIN_LOCK_MS = 30 * 1000;
const TOKEN_DEFAULTS = { piano: 3, violin: 2, reading: 2, maths: 2, room: 1, chore: 1, writing: 2, story: 2, toys: 1, table: 1 };
const ALLDONE_DEFAULTS = { henry: 2, hayley: 1 };
const MAX_TOKENS_PER_JOB = 50;
const WISH_PRESETS = [
  { id: 'scitech', emoji: '🔬', name: 'Scitech', price: 120 },
  { id: 'aqwa',    emoji: '🐠', name: 'AQWA aquarium', price: 120 },
  { id: 'zoo',     emoji: '🦒', name: 'Perth Zoo', price: 100 },
  { id: 'book',    emoji: '📚', name: 'A new book', price: 40, little: 20 },
  { id: 'park',    emoji: '🛝', name: 'Park or playground trip', price: 30 },
  { id: 'bike',    emoji: '🚲', name: 'Ride bicycle', price: 20 },
  { id: 'playdate',emoji: '🧒', name: 'Play date with friends', price: 35 },
  { id: 'skating', emoji: '🛼', name: 'Roller skating', price: 45 },
  { id: 'bounce',  emoji: '🤸', name: 'Bounce (trampoline park)', price: 60 },
  { id: 'chuck',   emoji: '🐭', name: "Chuck E. Cheese", price: 75 },
  { id: 'overseas',emoji: '✈️', name: 'Overseas trip', price: 500, familySuggested: true },
  { id: 'treat',   emoji: '🍦', name: 'Ice cream or treat outing', price: 25 },
  { id: 'other',   emoji: '✨', name: 'Something else', price: 50 }
];
/* v3.5.0: a bonus challenge can have "slots" — separate actions on the same day, each checked by a
   grown-up and each worth the challenge's tokens. Day status key = extraId + SLOT_SEP + slotId. */
const SLOT_SEP = '@';
const cleanTableExtra = () => ({ id: 'cleantable', emoji: '🧽', name: 'Clean the table', tokens: 1,
  slots: [ { id: 'breakfast', emoji: '🥣', label: 'Breakfast' }, { id: 'lunch', emoji: '🥪', label: 'Lunch' }, { id: 'dinner', emoji: '🍝', label: 'Dinner' } ] });

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'i' + Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pad = n => String(n).padStart(2, '0');

/* Time. "?now=2026-10-02T15:00" lets a grown-up (or a test) pretend it is another day/time. */
let TIME_OFFSET = 0;
try {
  const q = new URLSearchParams(location.search).get('now');
  if (q) { const t = new Date(q); if (!isNaN(t)) TIME_OFFSET = t.getTime() - Date.now(); }
} catch (e) {}
const now = () => Date.now() + TIME_OFFSET;
const keyOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayKey = () => keyOf(new Date(now()));
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (k, n) => { const d = fromKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const dow = k => fromKey(k).getDay();
const weekKey = k => addDays(k, -((dow(k) + 6) % 7));
const fmtDate = k => fromKey(k).toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtShort = k => fromKey(k).toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
const shortDow = k => fromKey(k).toLocaleDateString('en-AU', { weekday: 'short' });
const fmtClock = sec => { sec = Math.max(0, Math.ceil(sec)); return Math.floor(sec / 60) + ':' + pad(sec % 60); };
const defaultTokens = t => {
  if (t && TOKEN_DEFAULTS[t.id] != null) return TOKEN_DEFAULTS[t.id];
  const n = ((t && t.name) || '') + ' ' + ((t && t.note) || '');
  return /piano|violin|practi|music|math|lesson|homework|writ|read|story/i.test(n) ? 2 : 1;
};

function defaultData() {
  return {
    version: DATA_VERSION,
    pin: '1234', pinChanged: false,
    // bookTokens per confirmed book Q&A (every book), napTokens for NAPLAN writing,
    // capOn/cap = optional daily token limit (off by default), maxGoals = active wishes per child
    rules: { bookTokens: 1, napTokens: 5, capOn: false, cap: 30, maxGoals: 1 },
    kids: [
      { id: 'henry', name: 'Henry', avatar: '🦖', color: 'blue', readAloud: false, big: false, naplan: true, stars: false, allDone: 2,
        tasks: [
          { id: 'piano',   emoji: '🎹', name: 'Piano',          note: 'Practise for 30 minutes', minutes: 30, type: 'daily', outing: true, tokens: 3 },
          { id: 'violin',  emoji: '🎻', name: 'Violin',         note: 'Practise for 20 minutes', minutes: 20, type: 'daily', outing: true, tokens: 2 },
          { id: 'reading', emoji: '📖', name: 'Reading',        note: READING_NOTE_V2,           minutes: 20, type: 'daily', outing: false, books: true, tokens: 0 },
          { id: 'maths',   emoji: '🔢', name: 'Maths with Sam', note: 'Riverton Singapore Math – one lesson', minutes: 0, type: 'daily', outing: false, tokens: 2 },
          { id: 'room',    emoji: '🛏️', name: 'Tidy my room',   note: 'Bed, floor and desk',      minutes: 0, type: 'daily', outing: false, tokens: 1 },
          { id: 'chore',   emoji: '🧹', name: 'One chore',      note: 'e.g. sweep the floor',     minutes: 0, type: 'daily', outing: false, tokens: 1 },
          { id: 'writing', emoji: '✏️', name: 'English writing', note: 'Homework for Friday 4pm class', minutes: 0, type: 'weekly', outing: false, needThuFri: false, tokens: 2 }
        ] },
      { id: 'hayley', name: 'Hayley', avatar: '🦄', color: 'pink', readAloud: true, big: true, naplan: false, stars: true, allDone: 1,
        tasks: [
          { id: 'story', emoji: '📚', name: 'Story time',    note: '15 minutes of books', minutes: 15, type: 'daily', outing: false, tokens: 2 },
          { id: 'toys',  emoji: '🧸', name: 'Tidy toys',     note: 'Toys back in the box', minutes: 0, type: 'daily', outing: false, tokens: 1 },
          { id: 'table', emoji: '🍽️', name: 'Set the table', note: 'One little job',      minutes: 0, type: 'daily', outing: false, tokens: 1 }
        ] }
    ],
    extras: [
      { id: 'samextra', emoji: '📘', name: 'Finished one more Sam book/set', tokens: 2 },
      { id: 'fold', emoji: '👕', name: 'Fold clothes', tokens: 1 },
      { id: 'dinner', emoji: '🍽️', name: 'Set up dinner + put used dishes in the dishwasher', tokens: 2 },
      cleanTableExtra()
    ],
    outing: {},   // 'YYYY-MM-DD': true
    napSeen: {},  // kidId -> [NAPLAN prompt ids already used] (no repeats until the bank is used up)
    days: {},     // kidId -> date -> { t:{taskId:status}, x:{extraId:status}, cel:bool, sum:{},
                  //                    books:[{id,title,type,qs:[{id,q}],ans:[],wp:{id,q},story,paper,s}], nap:{pid,type,title,prompt,text,paper,checks,shuffled,s} }
    weeks: {},    // kidId -> mondayDate -> { taskId: status }
    ledger: {},   // kidId -> [{ id, ref, dk, at, n, k:'earn'|'bonus'|'adjust'|'redeem'|'jar'|'refund', label, note, goal }]
    goals: [],    // [{ id, owner:kidId|'family', by, preset, emoji, title, text, status:'proposed'|'approved'|'redeem'|'done'|'declined'|'cancelled', price, ... }]
    tokensSince: todayKey() // tokens are only worked out automatically from this day on
  };
}
/* Versioned settings migration. Only touches what each version changed; every other parent
   customisation, the PIN, history and today's progress are kept as they are. */
function migrate(d) {
  const from = +d.version || 1;
  if (from < 2) {
    const h = d.kids.find(k => k && (k.id === 'henry' || /henry/i.test(k.name || '')));
    if (h && Array.isArray(h.tasks)) {
      const setMins = (id, re, mins) => {
        const t = h.tasks.find(x => x && x.id === id) || h.tasks.find(x => x && re.test(x.name || ''));
        if (!t) return;
        const old = +t.minutes || 0; t.minutes = mins;
        if (old && old !== mins && typeof t.note === 'string') t.note = t.note.replace(new RegExp('\\b' + old + '( ?min)'), mins + '$1');
      };
      setMins('piano', /piano/i, 30);
      setMins('violin', /violin/i, 20);
      const rd = h.tasks.find(x => x && x.id === 'reading') || h.tasks.find(x => x && x.type !== 'weekly' && /read/i.test(x.name || ''));
      if (rd && rd.books === undefined) { rd.books = true; if (rd.note === 'Read for 20 minutes') rd.note = READING_NOTE_V2; }
      if (h.naplan === undefined) h.naplan = true;
    }
  }
  if (from < 3) {
    // v3: the screen-time reward is gone. Old minute rules are dropped (nothing is converted);
    // every job gets a token value and each child an "all must-dos done" bonus.
    d.rules = { bookTokens: 3, napTokens: 5, capOn: false, cap: 30, maxGoals: 1 };
    d.kids.forEach(k => {
      if (!k || typeof k !== 'object') return;

/* ---------- PIN pad ---------- */
function pinPad({ title = 'Grown-ups only', sub = 'Enter your 4-digit PIN', check }) {
  return new Promise(res => {
    let val = '', done = false;
    const m = openModal(`<div class="pin"><div style="font-size:56px">🔐</div><h2>${esc(title)}</h2><p>${esc(sub)}</p>
      <div class="dots"><i></i><i></i><i></i><i></i></div>
      <div class="keys">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button class="key" data-k="${n}">${n}</button>`).join('')}
        <button class="key" data-k="x" aria-label="Cancel">✖️</button><button class="key" data-k="0">0</button><button class="key" data-k="b" aria-label="Delete">⌫</button></div>
      <div class="pinerr"></div></div>`,
      { type: 'pin', onClose: () => { document.removeEventListener('keydown', onKey); if (!done) res(null); } });
    const redraw = () => $$('.dots i', m.el).forEach((d, i) => d.classList.toggle('on', i < val.length));
    const err = msg => { $('.pinerr', m.el).textContent = msg || ''; };
    let busy = false;
    const press = k => {
      if (busy) return;
      if (k === 'x') { closeModal(m); return; }
      if (now() < S.pinLockUntil) { err('Too many tries. Please wait ' + Math.ceil((S.pinLockUntil - now()) / 1000) + ' s'); return; }
      if (k === 'b') { val = val.slice(0, -1); redraw(); err(''); return; }
      if (val.length >= 4) return;
      val += k; redraw(); err('');
      if (val.length === 4) {
        const r = check(val); busy = true;
        if (r === true) { done = true; setTimeout(() => { closeModal(m); res(val); }, 120); }
        else {
          const box = $('.pin', m.el); box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
          setTimeout(() => { val = ''; redraw(); err(r); busy = false; }, 300);
        }
      }
    };
    m.el.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) press(b.dataset.k); });
    const onKey = e => { if (topModal() !== m) return; if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('b'); else if (e.key === 'Escape') press('x'); };
    document.addEventListener('keydown', onKey);
  });
}
function verifyPin(title, sub) {
  return pinPad({ title, sub, check: p => {
    if (p === D.pin) { S.pinFails = 0; return true; }
    S.pinFails++;
    if (S.pinFails >= PIN_MAX_FAILS) { S.pinLockUntil = now() + PIN_LOCK_MS; S.pinFails = 0; return 'Too many tries. Please wait 30 s'; }
    return 'Oops, that PIN is not right';
  } }).then(p => !!p);
}

}

const shuffled = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function usedIds(kid, dk, key, exceptId) {
  const today = new Set(), recent = new Set();
  for (let i = 0; i < 7; i++) {
    const k = addDays(dk, -i);
    for (const b of booksOf(kid, k)) {
      if (b.id === exceptId) continue;
      const ids = key === 'q' ? (b.qs || []).map(q => q.id) : b.wp ? [b.wp.id] : [];
      ids.forEach(id => (i === 0 ? today : recent).add(id));
    }
  }
  return { today, recent };
}
/* 3 different questions: never repeated within the same day, avoid the last 6 days where possible, different categories */
function pickQuestions(kid, dk, type, exceptId) {
  const { today, recent } = usedIds(kid, dk, 'q', exceptId);
  const pool = QBANK.filter(q => (q.t === 'a' || q.t === type) && !today.has(q.id));
  const fresh = shuffled(pool.filter(q => !recent.has(q.id))), old = shuffled(pool.filter(q => recent.has(q.id)));
  const out = [], cats = new Set();
  for (const list of [fresh, old]) for (const q of list) { if (out.length < 3 && !cats.has(q.c)) { out.push(q); cats.add(q.c); } }
  for (const q of fresh.concat(old)) if (out.length < 3 && !out.includes(q)) out.push(q);
  for (const q of shuffled(QBANK)) if (out.length < 3 && !out.includes(q)) out.push(q); // (only if the bank ran out)
  return out.map(q => ({ id: q.id, q: q.q }));
}
function pickWriting(kid, dk, type, exceptId) {

  const pool = WBANK.filter(w => (w.t === 'a' || w.t === type) && !today.has(w.id));
  const pick = shuffled(pool.filter(w => !recent.has(w.id)))[0] || shuffled(pool)[0] || shuffled(WBANK)[0];
  return { id: pick.id, q: pick.q };
}

function nextPrompt(kid, exclude = []) {

}

function pendingItems(kid) {

    (Array.isArray(r.books) ? r.books : []).forEach((b, bi) => { if (b.s === 'pending') items.push({ kind: 'b', dk, id: b.id, emoji: '📚', name: `Book ${bi + 1}: “${b.title}”` + (bi === 0 ? ' (Reading)' : ' (bonus)'), qa: bookQA(b) }); });
    if (r.nap && r.nap.s === 'pending') items.push({ kind: 'n', dk, id: 'nap', emoji: '✍️', name: 'NAPLAN writing (bonus)', qa: napQA(r.nap) });
  }
  const w = (D.weeks[kid.id] && D.weeks[kid.id][weekKey(S.today)]) || {};
  for (const [id, s] of Object.entries(w)) if (s === 'pending') { const t = kid.tasks.find(x => x.id === id); items.push({ kind: 'w', dk: S.today, id, emoji: t ? t.emoji : '✏️', name: (t ? t.name : 'Weekly job') + ' (this week)' }); }

}
/* tokens a waiting item will give when confirmed (first book also completes the Reading must-do) */
function itemWorth(kid, it) {

    if (k === 'kid.allDone') { const kid = kidById(el.dataset.kid); if (kid) kid.allDone = clamp((+kid.allDone || 0) + d, 0, MAX_TOKENS_PER_JOB); }
    else { const lim = { bookTokens: [0, MAX_TOKENS_PER_JOB], napTokens: [0, MAX_TOKENS_PER_JOB], maxGoals: [1, 3], cap: [5, 300] }[k]; if (!lim) return;
      D.rules[k] = clamp((+D.rules[k] || 0) + d, lim[0], lim[1]); }
    save(); render();
  },
  testvoice() { speak('Hello! Great practising! Well done!'); },
  async changepin() { await changePin(); render(); },
  export() {
    const txt = exportJSON(), name = `holiday-quest-backup-${S.today}.json`;
    try {
      const file = new File([txt], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: 'Holiday Quest backup' }).catch(() => {}); return; }
    } catch (e) {}
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' })); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); toast('💾 Backup saved');
  },
  copyexport() {
    const txt = exportJSON();
    const fallback = () => { const ta = $('textarea[data-import=text]'); if (ta) { ta.value = txt; ta.focus(); ta.select(); } toast('📋 Backup text is in the box below — copy it'); };
    try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(txt).then(() => toast('📋 Backup copied'), fallback); return; } } catch (e) {}
    fallback();
  },
  importtext() { const ta = $('textarea[data-import=text]'); if (ta && ta.value.trim()) importText(ta.value.trim()); else toast('Paste the backup text first'); },
  resettoday() {
    confirmModal({ emoji: '🧹', title: "Clear today's ticks?", text: 'Both kids start today again (tokens earned today are removed). Other days and wishes stay.', yes: 'Clear today', danger: true }).then(ok => {
      if (!ok) return; D.kids.forEach(k => { if (D.days[k.id]) delete D.days[k.id][S.today]; D.ledger[k.id] = ledgerOf(k.id).filter(e => !(isEarn(e) && e.dk === S.today)); }); save(); render(); toast('🧹 Today cleared');
    });
  },
  resetall() {
    confirmModal({ emoji: '⚠️', title: 'Reset everything?', text: 'All jobs, history, tokens, wishes, settings and the PIN go back to the start. Save a backup first!', yes: 'Reset everything', danger: true }).then(async ok => {
      if (!ok) return;
      const sure = await confirmModal({ emoji: '⚠️', title: 'Are you really sure?', text: 'This cannot be undone.', yes: 'Yes, reset', danger: true });
      if (!sure) return; D = defaultData(); save(); S.parentUntil = 0; S.view = 'home'; render(); toast('Everything was reset');
    });
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (S.view === 'parent') S.parentUntil = now() + PARENT_IDLE_MS;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('toggle', e => {
  const d = e.target; if (!d.matches || !d.matches('details[data-details]')) return;
  S.openDetails[d.dataset.details] = d.open;
}, true);
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset || !el.dataset.bind) return;
  const tg = bindTarget(el.dataset.bind); if (!tg) return;
  tg.obj[tg.key] = String(el.value).slice(0, 5000);
  saveSoon(); liveUpdate();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('[data-import=file]')) {
    const f = el.files && el.files[0]; if (!f) return;
    const rd = new FileReader(); rd.onload = () => importText(String(rd.result)); rd.readAsText(f); el.value = ''; return;
  }
  if (el.matches('input[type=file][data-act=napphoto]')) {
    const f = el.files && el.files[0], n = napFor(curKid(), S.today, false); if (!f || !n || n.s !== 'todo') return;
    if (f.size > 1800000) { toast('That photo is a bit large — please choose a smaller one 📷'); el.value=''; return; }
    const rd = new FileReader(); rd.onload = () => { n.photo = String(rd.result || ''); save(); render(); toast('📷 Handwriting photo saved'); }; rd.readAsDataURL(f); return;
  }
  if (!el.dataset.edit) return;
  if (S.view === 'parent') S.parentUntil = now() + PARENT_IDLE_MS;
  const [scope, field] = el.dataset.edit.split('.');
  const kid = kidById(S.pkid) || D.kids[0];
  const val = el.type === 'checkbox' ? el.checked : el.type === 'number' ? clamp(Math.round(+el.value || 0), 0, field === 'tokens' ? MAX_TOKENS_PER_JOB : 180) : String(el.value).trim();
  const obj = scope === 'kid' ? kid : scope === 't' ? kid.tasks[+el.dataset.i] : scope === 'x' ? D.extras[+el.dataset.i] : scope === 'rules' ? D.rules : null;
  if (!obj) return;
  if (val === '' && (field === 'name' || field === 'emoji' || field === 'avatar')) { el.value = obj[field]; return; }
  obj[field] = val;
  if (el.type === 'number') el.value = val;
  refreshToday(); save(); toast('✔️ Saved');
  if (el.type === 'checkbox' || el.tagName === 'SELECT' || scope === 'kid' || scope === 'rules') render();
});

/* ---------- ticking ---------- */
function tick() {
  const tk = todayKey();
  if (tk !== S.today) { S.today = tk; const m = topModal('practice'); if (m) closeModal(m); render(); return; }
  if (S.view === 'parent' && now() > S.parentUntil) { S.parentUntil = 0; S.view = 'home'; MODALS.slice().forEach(m => closeModal(m)); render(); toast('🔒 Grown-up mode closed'); return; }
  if (S.view === 'naplan') { $$('[data-naptimer]').forEach(el => { const n = napFor(curKid(), S.today, false); if (n) el.textContent = '⏱️ ' + fmtClock(napTimeLeft(n, el.dataset.naptimer)); }); }
  if (S.pt && !S.pt.finished) {
    const left = ptLeft(), m = topModal('practice');
    if (left <= 0) {
      S.pt.finished = true; S.pt.start = null; chime('yay'); confetti();
      const k = kidById(S.pt.kid), t = k && k.tasks.find(x => x.id === S.pt.task);
      speak(t ? `${praise(t, S.today)} ${t.name} time is finished.` : 'Great practising!');
      refreshModals();
    } else if (m) {
      const c = $('[data-live=ptclock]', m.el); if (c) c.textContent = fmtClock(left);
      const ring = $('[data-live=ring]', m.el); if (ring) ring.setAttribute('stroke-dashoffset', RING_C * (1 - clamp(left / S.pt.total, 0, 1)));
    }
  }
}
setInterval(tick, 500);
document.addEventListener('visibilitychange', () => { if (document.hidden) flushSave(); else tick(); });
window.addEventListener('pagehide', flushSave);
window.addEventListener('storage', e => { if (e.key === STORE_KEY) { D = load(); afterLoad(); render(); } });

/* ---------- start ---------- */
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  // Optional: if sw.js sits next to this file on an https host, the app also opens with no internet.
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
if (MIGRATED) save(); // v1/v2 → v3 upgrade is stored straight away
afterLoad(); // today's already-confirmed jobs earn tokens once, right after the upgrade
driveSetupFromHash();
render();
</script>
</body>
</html>
